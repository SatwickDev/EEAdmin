features:
  enable_enhanced_classification: true
  enable_entity_extraction: true
  enable_compliance_checking: true
  enable_progress_tracking: true
  enable_preview_images: true
  enable_ocr_caching: false
logging:
  level: INFO
  log_classification_results: true
  log_extraction_results: true
  log_compliance_results: true
  log_processing_times: true
  log_api_calls: true
chunking:
  enabled: true
  entity_count_thresholds:
    small: 10
    medium: 20
    large: 30
  chunk_counts:
    small: 2
    medium: 3
    large: 4
    xlarge: 5
  base_seed: 12345
  seed_increment_per_chunk: 1
  min_entities_per_chunk: 1
  prioritize_mandatory_first: true
  priority_order:
  - Mandatory
  - Optional
  - Conditional
  prompt_template: "You are an advanced AI-powered data extraction engine specialized\
    \ in international trade finance documents. You are processing a CHUNK of entities\
    \ for efficient parallel extraction.\n\n## CHUNK EXTRACTION RULES:\n\n### 1. STRICT\
    \ FIELD SCOPE:\n- Extract ONLY the fields explicitly listed in this chunk\n- Do\
    \ NOT extract any other fields not in the chunk list\n- Focus on accuracy and\
    \ precision for the specified fields only\n\n### 2. DOCUMENT TYPE AWARENESS:\n\
    - Use your knowledge of the document type to interpret field values correctly\n\
    - Apply document-specific formatting and validation rules\n- Consider standard\
    \ patterns for this document type\n\n### 3. MANDATORY INCLUSION:\n- Include ALL\
    \ fields in the response, even if not found\n- Use empty string \"\" with confidence\
    \ 0 for missing fields\n- Never omit a field from the output\n\n### 4. DATA FORMATTING:\n\
    **DATES:**\n- Format: YYYY-MM-DD (ISO 8601)\n- Convert all date formats consistently\n\
    \n**AMOUNTS:**\n- Include currency code (e.g., \"USD 60,465.00\")\n- Use comma\
    \ thousand separators\n\n**BOUNDING BOXES:**\n- Use [0, 0, 0, 0] if no OCR coordinates\
    \ available\n- Do NOT fabricate coordinates\n\n### 5. EXACT TEXT EXTRACTION (CRITICAL\
    \ - HIGHEST PRIORITY):\n\n**exact_text field:** Provides positioning context for\
    \ bounding box generation. This field is CRITICAL for the entire system - incorrect\
    \ extraction causes complete failure of bounding box highlighting.\n\n**CORE PRINCIPLE:**\
    \ Extract text EXACTLY as it appears in OCR. Copy character-by-character including\
    \ all spaces, punctuation, \\n, and formatting quirks. Never clean or normalize.\n\
    \n**EXTRACTION PRIORITY:**\n\n**Priority 1 - SWIFT Field Codes (ALWAYS PREFER):**\n\
    If SWIFT field code exists (50:, 41A:, 32B:, 31D:, 59:, etc.), use it:\n- Field\
    \ code must be within 1-3 lines DIRECTLY before the value\n- If other data exists\
    \ between field code and value, do NOT use that field code\n- Include field code\
    \ + all \\n and intermediate text (only if no other data) + value line\n- STOP\
    \ immediately after value line ends - never include next line even if duplicate\
    \ or related\n\n**Priority 2 - Document Field Labels (SECOND CHOICE - 95% SEMANTIC\
    \ MATCH REQUIRED):**\nIf no SWIFT code, look for document field labels with 95-100%\
    \ semantic confidence:\n\nHIGH CONFIDENCE MATCHES (USE THESE):\n- For \"Consignee/Buyer/Importer\"\
    \ → Accept: \"Consignee:\", \"Buyer:\", \"Ship To:\", \"Importer:\", \"Sold\
    \ To:\"\n- For \"Invoice_Number\" → Accept: \"Invoice No:\", \"Invoice Number:\"\
    , \"Inv No:\", \"Invoice #:\"\n- For \"Currency\" → Accept: \"Currency:\", \"\
    CCY:\", \"Curr:\"\n- For \"Number_of_Packages\" → Accept: \"No. of Packages:\"\
    , \"Packages:\", \"Pkg Qty:\", \"Total Packages:\"\n- For \"Port_of_Discharge\"\
    \ → Accept: \"Port of Discharge:\", \"Discharge Port:\", \"POD:\"\n-For \"Origin\
    \ country\" -> Accept : \"Country of Orgin \"\n\nLOW CONFIDENCE MATCHES (REJECT\
    \ THESE):\n- Section headings like \"Marks, numbers, number and kind of packages;\
    \ description of goods\" (NOT a field label for \"Number_of_Packages\")\n- Generic\
    \ words like \"Payment\", \"Details\", \"Total\", \"Note\", \"Description\", \"\
    Information\"\n- Vague partial matches like \"Discharge\" for \"Port_of_Discharge\"\
    \ (too vague)\n\nCRITICAL RULES FOR FIELD LABELS:\n- Field label MUST be within\
    \ 1-2 lines DIRECTLY before value\n- If 3+ lines of OTHER DATA exist between label\
    \ and value, do NOT use that label\n- Field labels appear BEFORE the value, NEVER\
    \ after\n- Ask: \"If I see only this label, am I 95%+ sure it means THIS field?\"\
    \ If NO, reject it\n- Section headings are NOT field labels\n\nWhen valid field\
    \ label found:\n- Include field label + value line ONLY\n- STOP immediately after\
    \ value line\n- Do NOT include blocks of multiple lines\n\n**Priority 3 - No Field\
    \ Label Found:**\nIf NO SWIFT code AND NO high-confidence field label exists:\n\
    - Single-word values (EUR, USD, 5%, dates, codes):\n  - If on its own line OR\
    \ directly next to a label → use label + value\n  - If buried in sentence with\
    \ no label → extract ONLY the value word, no surrounding context\n- Multi-word\
    \ values (company names, addresses): Extract ONLY the value text exactly as it\
    \ appears\n- DO NOT force a field label if none exists\n- DO NOT add surrounding\
    \ words for context if value is in a sentence\n\n**ABSOLUTE STOPPING RULE (NON-NEGOTIABLE):**\n\
    The exact_text MUST END exactly where the value line ends. Count carefully:\n\
    - Line N: Field code/label (if exists) - INCLUDE\n- Line N+1 or N+2: Value line\
    \ - INCLUDE and STOP HERE\n- Line N+2 onwards: ANY text after value - EXCLUDE\
    \ COMPLETELY\n\nDo NOT continue to next line even if:\n- Next line is duplicate\
    \ of value\n- Next line seems related (branch, location, additional info)\n- Next\
    \ line has similar data\n\nSTOP means STOP. No exceptions.\n\n**FORMATTING PRESERVATION\
    \ (NON-NEGOTIABLE):**\nPreserve ALL formatting exactly as in OCR:\n- Spaces: single,\
    \ double, multiple, tabs - keep all\n- Punctuation: commas, periods, semicolons,\
    \ colons, dashes - keep all\n- Line breaks: \\n - keep all exactly as they appear\n\
    - Capitalization: keep exactly as found\n- Leading/trailing whitespace: keep all\n\
    \n**SPECIAL CASES:**\n- Multi-line values: If entire address/description IS the\
    \ value, include all value lines with \\n, then STOP\n- Inferred/calculated values:\
    \ If value doesn't exist in OCR (you calculated or guessed it), exact_text = ''\n\
    - Duplicate lines: If value appears on consecutive lines, include ONLY the first\
    \ occurrence, STOP\n\n**CRITICAL EXAMPLES:**\n\nCORRECT - SWIFT code, stops at\
    \ value:\nOCR: \"41A: Available With. By. FI BIC\\nSPDBCNSH090\\nSHANGHAI PUDONG\
    \ DEVELOPMENT BANK\\n(ZHENGZHOU BRANCH)\"\nField: \"Bank_BIC\"\nvalue: 'SPDBCNSH090'\n\
    exact_text: '41A: Available With. By. FI BIC\\nSPDBCNSH090'\n\nWRONG - Continuing\
    \ past value:\nOCR: \"PORT OF DISCHARGE\\nPLACE OF DELIVERY\\nABU DHABI SEAPORT,\\\
    nABU DHABI SEAPORT,\"\nField: \"Port_of_Discharge\"\nvalue: 'ABU DHABI SEAPORT'\n\
    WRONG exact_text: 'PORT OF DISCHARGE\\nPLACE OF DELIVERY\\nABU DHABI SEAPORT,\\\
    nABU DHABI SEAPORT,'\nCORRECT exact_text: 'PORT OF DISCHARGE\\nABU DHABI SEAPORT,'\n\
    (Stops at first occurrence of value, does NOT include duplicate or \"PLACE OF\
    \ DELIVERY\")\n\nWRONG - Using section heading as field label:\nOCR: \"7. Marks,\
    \ numbers, number and kind of packages; description of goods\\nKANEMITE SC\\nGREEN\
    \ OASIS CO. LLC,\\n3 PALLETS\"\nField: \"Number_of_Packages\"\nvalue: '3 PALLETS'\n\
    WRONG exact_text: '7. Marks, numbers, number and kind of packages; description\
    \ of goods\\nKANEMITE SC\\nGREEN OASIS CO. LLC,\\n3 PALLETS'\nCORRECT exact_text:\
    \ '3 PALLETS'\n(Section heading is NOT a field label, other data between heading\
    \ and value, so just extract value)\n\nCORRECT - Single word with no field label:\n\
    OCR: \"The amount is EUR total\"\nField: \"Currency\"\nvalue: 'EUR'\nexact_text:\
    \ 'EUR'\n(Buried in sentence, no field label, just extract value word only)\n\n\
    CORRECT - Single word with field label:\nOCR: \"Currency: EUR\"\nField: \"Currency\"\
    \nvalue: 'EUR'\nexact_text: 'Currency: EUR'\n(Field label directly before value,\
    \ include both)\n\nWRONG - Using invalid field label:\nOCR: \"Payment\\nGREEN\
    \ OASIS CO. LLC.\"\nField: \"Consignee/Buyer\"\nvalue: 'GREEN OASIS CO LLC'\n\
    WRONG exact_text: 'Payment\\nGREEN OASIS CO. LLC.'\nCORRECT exact_text: 'GREEN\
    \ OASIS CO. LLC.'\n(\"Payment\" is NOT semantically related to Consignee/Buyer\
    \ with 95% confidence, so just extract value)\n\n**SINGLE LINE EXTRACTION FOR\
    \ VALUES IN PARAGRAPHS:**\nIf value appears within a multi-line paragraph or statement:\n\
    - Identify the SPECIFIC LINE where the value appears\n- Extract ONLY that line\
    \ (plus field label line if directly before it)\n- DO NOT extract the entire paragraph\n\
    \n**WARNING - SYSTEM FAILURE CONSEQUENCES:**\nIncorrect exact_text extraction\
    \ causes:\n- Bounding box highlighting failures\n- Wrong text regions highlighted\
    \ in document\n- Complete system malfunction\n- User cannot locate extracted data\
    \ in document\n\nThis field is the FOUNDATION of the entire bounding box system.\
    \ Treat with maximum care and precision.\n\n**FINAL CHECKLIST BEFORE OUTPUTTING:**\n\
    - Used SWIFT code if available and within 1-3 lines?\n- Used field label ONLY\
    \ if 95%+ semantic match AND within 1-2 lines?\n- Rejected section headings and\
    \ generic words as field labels?\n- Stopped IMMEDIATELY after value line?\n- Did\
    \ NOT include duplicate lines or trailing text?\n- Preserved exact formatting\
    \ (spaces, \\n, punctuation)?\n- Set exact_text = '' for inferred/calculated values?\n\
    \n### 6. OUTPUT STRUCTURE:\nReturn ONLY valid JSON (no markdown, no commentary):\n\
    {{\n  \"page_number\": <int>,\n  \"extracted_fields\": {{\n    \"Field_Name\"\
    : {{\n      \"value\": \"<extracted value or empty string>\",\n      \"exact_text\"\
    : \"<exact value from OCR without changes>\",\n      \"confidence\": <0-100>,\n\
    \      \"bounding_box\": [x1, y1, x2, y2],\n      \"bounding_page\": <page>\n\
    \    }}\n  }},\n  \"confidence_score\": <overall 0-100>\n}}\n\n### Document Context:\n\
    **Document Type:** {document_type}\n\nThis is a **{document_type}** document.\
    \ Use your knowledge of this document type to help identify and extract the fields\
    \ accurately.\n\n### Extraction Task - Chunk {chunk_id}\nYou are processing chunk\
    \ {chunk_id} containing {field_count} specific entities.\n\n### Fields to Extract\
    \ in This Chunk ({field_count} fields):\n\n{fields_text}\n\n### OCR Text (Page\
    \ {page_number}):\n{ocr_text}\n\n### Required JSON Response:\nReturn ONLY valid\
    \ JSON (no markdown, no commentary):\n\n{{\n  \"page_number\": {page_number},\n\
    \  \"extracted_fields\": {{\n    \"<Field_Name>\": {{\n      \"value\": \"<extracted\
    \ value or empty string>\",\n      \"exact_text\": \"<exact value from OCR without\
    \ changes>\",\n      \"confidence\": <0-100>,\n      \"bounding_box\": [<x1>,\
    \ <y1>, <x2>, <y2>],\n      \"bounding_page\": {page_number}\n    }}\n  }},\n\
    \  \"confidence_score\": <overall 0-100>\n}}\n"
required_documents:
  model: gpt-4o
  temperature: 0.1
  max_tokens: 14000
  seed: 12345
  top_p: 0.1
  frequency_penalty: 0
  presence_penalty: 0
  system_prompt: You are a trade finance expert. Extract ALL documents from the text
    and return a JSON object with a 'documents' array. Each document must have 'name',
    'description', 'priority', and 'category' fields.
  user_prompt_template: "You are a trade finance document expert. Parse the following\
    \ required documents text and return a JSON object with a \"documents\" array.\n\
    \nTEXT TO PARSE:\n{required_documents_text}\n\nINSTRUCTIONS:\n1. Extract EVERY\
    \ distinct document mentioned in the text\n2. Each document should be a JSON object\
    \ with these exact fields:\n   - \"name\": Document type (e.g., \"Commercial Invoice\"\
    , \"Bill of Lading\")\n   - \"description\": Brief requirements (10-15 words)\n\
    \   - \"priority\": \"Mandatory\" or \"Optional\" \n   - \"category\": \"trade\"\
    , \"financial\", \"certification\", \"shipping\", or \"other\"\n\nRESPONSE FORMAT:\n\
    Return a JSON object with this structure:\n{{\n  \"documents\": [\n    {{\"name\"\
    : \"Commercial Invoice\", \"description\": \"Signed original, attested, legalized\"\
    , \"priority\": \"Mandatory\", \"category\": \"trade\"}},\n    {{\"name\": \"\
    Bill of Lading\", \"description\": \"Clean shipped on board, full set\", \"priority\"\
    : \"Mandatory\", \"category\": \"shipping\"}}\n  ]\n}}\n\nExtract ALL documents\
    \ mentioned - typically 5-15 documents in an LC.\n\nCRITICAL INSTRUCTIONS:\n-\
    \ Extract ALL documents mentioned in the text above\n- If you see numbers (1,\
    \ 2, 3...) or bullets, each one is typically a separate document\n- Look for document\
    \ names like \"invoice\", \"bill of lading\", \"certificate\", \"policy\", \"\
    list\"\n- Standardize abbreviations: B/L → Bill of Lading, C/O → Certificate\
    \ of Origin, GSP → Certificate of Origin (GSP Form)\n- If one item mentions\
    \ multiple documents (e.g., \"invoice and packing list\"), create separate entries\n\
    - Return ONLY the JSON array with NO extra text\n\nOutput format:\n[\n  {{\"name\"\
    : \"Commercial Invoice\", \"description\": \"Signed original, attested, legalized\
    \ by embassy\", \"priority\": \"Mandatory\", \"category\": \"trade\"}},\n  {{\"\
    name\": \"Bill of Lading\", \"description\": \"Full set, clean on board, made\
    \ to order\", \"priority\": \"Mandatory\", \"category\": \"shipping\"}},\n  {{\"\
    name\": \"Certificate of Origin\", \"description\": \"Attested by chamber, legalized\"\
    , \"priority\": \"Mandatory\", \"category\": \"certification\"}},\n  {{\"name\"\
    : \"Marine Insurance Policy\", \"description\": \"110% invoice value, warehouse\
    \ to warehouse\", \"priority\": \"Mandatory\", \"category\": \"financial\"}},\n\
    \  {{\"name\": \"Packing List\", \"description\": \"Original plus copies\", \"\
    priority\": \"Mandatory\", \"category\": \"trade\"}}\n]\n"
  response_format: json_object
  fallback_json_extraction: true
  default_priority: Mandatory
  default_category: other
  categories:
  - trade
  - financial
  - certification
  - shipping
  - other
lc_conditions_parse:
  model: gpt-4o
  temperature: 0.1
  max_tokens: 15000
  seed: 12345
  top_p: 0.1
  frequency_penalty: 0
  presence_penalty: 0
  system_prompt: You are an expert LC conditions parser. Your task is to extract ALL
    INDIVIDUAL validation rules from LC Additional Conditions text. You MUST return
    a JSON ARRAY containing 15-30+ separate rule objects. Each requirement becomes
    its own rule object. NEVER return a single object - ALWAYS return an array [...].
  user_prompt_template: "CRITICAL INSTRUCTION: You MUST return a JSON ARRAY starting\
    \ with [ and ending with ]. DO NOT return a single object {{...}}. ALWAYS return\
    \ an array of multiple objects [{{...}}, {{...}}, {{...}}].\n\nTASK: Parse the\
    \ LC Additional Conditions text below into MULTIPLE separate validation rules.\
    \ Each numbered condition should produce 2-5+ individual rules.\n\nEXAMPLE - How\
    \ to extract rules:\nInput: \"1. ALL DOCUMENTS MUST BE DATED, PREPARED IN ENGLISH\
    \ ONLY AND MUST BEAR OUR L/C NUMBER DULY SIGNED BY ISSUER.\"\n\nOutput - ONE sentence\
    \ becomes FOUR separate rules in an ARRAY:\n[\n  {{\n    \"id\": \"lc-cond-001\"\
    ,\n    \"code\": \"LC-COND-001\", \n    \"category\": \"date_validation\",\n \
    \   \"description\": \"All documents must be dated\",\n    \"field_affected\"\
    : \"all_documents\",\n    \"validation_type\": \"date_required\",\n    \"expected_value\"\
    : \"valid_date\",\n    \"severity\": \"high\",\n    \"actionable\": true\n  }},\n\
    \  {{\n    \"id\": \"lc-cond-002\",\n    \"code\": \"LC-COND-002\",\n    \"category\"\
    : \"language\", \n    \"description\": \"All documents must be prepared in English\
    \ only\",\n    \"field_affected\": \"all_documents\",\n    \"validation_type\"\
    : \"language_check\", \n    \"expected_value\": \"English\",\n    \"severity\"\
    : \"high\",\n    \"actionable\": true\n  }},\n  {{\n    \"id\": \"lc-cond-003\"\
    , \n    \"code\": \"LC-COND-003\",\n    \"category\": \"reference_number\",\n\
    \    \"description\": \"All documents must bear LC number {{lc_number}}\",\n \
    \   \"field_affected\": \"all_documents\", \n    \"validation_type\": \"contains_lc_number\"\
    ,\n    \"expected_value\": \"{{lc_number}}\",\n    \"severity\": \"high\",\n \
    \   \"actionable\": true\n  }},\n  {{\n    \"id\": \"lc-cond-004\",\n    \"code\"\
    : \"LC-COND-004\", \n    \"category\": \"signature\",\n    \"description\": \"\
    All documents must be duly signed by issuer\",\n    \"field_affected\": \"all_documents\"\
    ,\n    \"validation_type\": \"signature_required\", \n    \"expected_value\":\
    \ \"signed\",\n    \"severity\": \"high\", \n    \"actionable\": true\n  }}\n\
    ]\n\nNOW PARSE THESE ACTUAL LC CONDITIONS:\n\nLC Number: {lc_number}\n\nAdditional\
    \ Conditions Text:\n{additional_conditions_text}\n\nINSTRUCTIONS:\n1. Read through\
    \ ALL 14+ numbered conditions in the text above\n2. Break down EACH condition\
    \ into separate atomic requirements\n3. Create a rule object for EACH atomic requirement\n\
    4. Return as JSON ARRAY with 15-30+ rule objects\n5. Start your response with\
    \ [ and end with ]\n6. DO NOT return just one rule - return ALL rules from ALL\
    \ conditions\n\nYour response must be a valid JSON array starting with [\n"
  response_format: text
  expected_rules_min: 15
  expected_rules_max: 30
lc_conditions_validate:
  model: gpt-4o
  temperature: 0.1
  max_tokens: 8000
  system_prompt: You are a precise LC validator. Return ONLY valid JSON array. No
    explanations. Check all rules against all documents.
  user_prompt_template: "Validate documents against LC conditions. Return ONLY valid\
    \ JSON array.\n\nLC DATA:\n- LC Number: {lc_number}\n- Beneficiary: {beneficiary}\n\
    - Issue Date: {issue_date}\n- Expiry Date: {expiry_date}\n\nDOCUMENTS ({doc_count}\
    \ total):\n{doc_summaries}\n\nRULES TO VALIDATE ({rules_count} rules):\n{batch_rules}\n\
    \nCRITICAL: Validate EACH rule against ALL {doc_count} documents.\n\nOUTPUT FORMAT\
    \ (JSON array only, no markdown):\n[\n  {{\n    \"rule\": {{\"code\": \"LC-COND-XXX\"\
    , \"description\": \"rule text\"}},\n    \"status\": \"compliant\" OR \"non_compliant\"\
    \ OR \"manual_review\",\n    \"isCompliant\": true OR false OR null,\n    \"message\"\
    : \"summary for all {doc_count} documents\",\n    \"severity\": \"high\",\n  \
    \  \"category\": \"category_name\",\n    \"details\": {{\n      \"compliant\"\
    : [{{\n        \"document\": \"Type\", \n        \"fileName\": \"name\", \n  \
    \      \"pages\": \"Pages X\", \n        \"reason\": \"why compliant\",\n    \
    \    \"fieldValue\": \"actual value found that made it compliant\",\n        \"\
    fieldName\": \"name of field checked\"\n      }}],\n      \"nonCompliant\": [{{\n\
    \        \"document\": \"Type\", \n        \"fileName\": \"name\", \n        \"\
    pages\": \"Pages X\", \n        \"reason\": \"why non-compliant\",\n        \"\
    fieldValue\": \"actual problematic value found\",\n        \"expectedValue\":\
    \ \"what was expected\",\n        \"fieldName\": \"name of field checked\"\n \
    \     }}],\n      \"requiresManualReview\": [{{\n        \"document\": \"Type\"\
    , \n        \"fileName\": \"name\", \n        \"pages\": \"Pages X\", \n     \
    \   \"reason\": \"why manual review needed\",\n        \"fieldValue\": \"actual\
    \ value found (if any)\",\n        \"fieldName\": \"name of field checked\"\n\
    \      }}]\n    }}\n  }}\n]\n\nCRITICAL: Always include actual field values that\
    \ were checked. For example:\n- fieldValue: \"Deutsche Bank AG\" (for language\
    \ check - non-compliant because German)\n- fieldValue: \"ILCAE00221000098\" (for\
    \ LC number check - compliant)  \n- fieldValue: \"15-Nov-2024\" (for date check\
    \ - compliant/non-compliant based on requirements)\n- fieldValue: \"\" or \"Not\
    \ found\" (for missing required fields)\n\nReturn results for all {rules_count}\
    \ rules. Check every document and show actual values.\n"
  batch_size: 4
  parallel_processing: true
discrepancy_rules:
  classify_rules:
    model: gpt-4o
    temperature: 0.1
    max_tokens: 2000
    system_prompt: You are a trade finance compliance expert. Classify rules accurately
      based on their purpose.
    user_prompt_template: "Analyze the following compliance rules and classify each\
      \ into ONE of these categories:\n\n1. **lc_comparison**: Rules that require\
      \ comparing a document field value against Letter of Credit (LC) requirements\n\
      \   Examples: \"must match LC\", \"consistent with LC\", \"as per LC terms\"\
      \n\n2. **cross_document**: Rules that require comparing values across different\
      \ documents\n   Examples: \"must match invoice\", \"consistent with packing\
      \ list\", \"match across documents\"\n\nNOTE: Only classify into lc_comparison\
      \ or cross_document. Do NOT include validation rules.\n\nRules to classify:\n\
      {rules_text}\n\nReturn ONLY a JSON object (no markdown, no explanation):\n{{\n\
      \  \"lc_comparison\": [list of rule codes],\n  \"cross_document\": [list of\
      \ rule codes]\n}}\n"
  lc_comparison:
    model: gpt-4o
    temperature: 0.1
    max_tokens: 2000
    system_prompt: You are a trade finance compliance expert comparing document fields
      against LC values.
    user_prompt_template: "You are a trade finance compliance expert. Analyze the\
      \ document fields against LC values based on the provided rules.\n\n**Document\
      \ Type:** {doc_type}\n**Document Name:** {doc_name}\n\n**Document Fields (Extracted\
      \ Entities):**\n{entities}\n\n**LC Context (All Available LC Fields):**\n{lc_context}\n\
      \n**Applicable Rules ({rules_count} rules):**\n{rules_summary}\n\n**Task:**\n\
      1. Identify which document fields should be compared against LC values based\
      \ on the rules\n2. For each relevant comparison, determine if the document value\
      \ is semantically equivalent to the LC value\n3. Accept semantic equivalence\
      \ (abbreviations, format variations, synonyms)\n4. Only flag as non-compliant\
      \ if there's a genuine discrepancy\n\n**CRITICAL RULES:**\n- NEVER make assumptions\
      \ about missing or empty values\n- If either documentValue or lcValue is empty,\
      \ null, \"N/A\", \"Not found\", or missing, you MUST still include it in the\
      \ comparison with \"compliant\": false\n- DO NOT substitute assumed values for\
      \ missing data\n- Return actual extracted values only - if no value exists,\
      \ use empty string \"\" or the exact text found\n\n**Return ONLY a JSON array:**\n\
      [\n  {{\n    \"field\": \"Document field name\",\n    \"documentValue\": \"\
      Value from document (use empty string if not found - DO NOT ASSUME)\",\n   \
      \ \"lcField\": \"Matching LC field name\",\n    \"lcValue\": \"Value from LC\
      \ (use empty string if not found - DO NOT ASSUME)\",\n    \"ruleCode\": \"R-XXXX\"\
      ,\n    \"ruleDescription\": \"Rule description\",\n    \"compliant\": false\
      \ if either value is missing/empty, otherwise true/false based on comparison,\n\
      \    \"explanation\": \"Brief explanation of comparison result\",\n    \"severity\"\
      : \"high\" if values are missing/empty, otherwise \"low\" or \"high\"\n  }}\n\
      ]\n\nReturn actual values only - DO NOT create placeholder values. If a field\
      \ is truly missing, use empty string \"\".\n"
  cross_document:
    model: gpt-4o
    temperature: 0.1
    max_tokens: 4000
    system_prompt: You are a trade finance expert checking cross-document consistency.
      Be thorough.
    user_prompt_template: "You are a trade finance compliance expert. Analyze field\
      \ consistency across multiple documents based on cross-document rules.\n\n**Documents\
      \ ({doc_count} total):**\n{doc_data}\n\n**Cross-Document Rules ({rules_count}\
      \ rules):**\n{rules_summary}\n\n**Task:**\n1. Identify which fields should be\
      \ consistent across documents based on the rules\n2. Compare values across documents\
      \ for semantic consistency\n3. Accept semantic equivalence (abbreviations, format\
      \ variations, synonyms)\n4. Flag genuine inconsistencies where values have different\
      \ meanings\n\n**Return ONLY a JSON array:**\n[\n  {{\n    \"field\": \"Field\
      \ name\",\n    \"document1Name\": \"First document name\",\n    \"document1Value\"\
      : \"Value in first document\",\n    \"document2Name\": \"Second document name\"\
      ,  \n    \"document2Value\": \"Value in second document\",\n    \"ruleCode\"\
      : \"R-XXXX\",\n    \"ruleDescription\": \"Rule description\",\n    \"compliant\"\
      : true or false,\n    \"explanation\": \"Brief explanation\",\n    \"severity\"\
      : \"low\" or \"medium\"\n  }}\n]\n\n**IMPORTANT:** Only include fields that\
      \ SHOULD be compared per the rules. Return empty array [] if no cross-document\
      \ comparisons are needed.\n"
