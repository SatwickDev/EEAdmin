      ,\n      \"pages\": { \"from\": 1, \"to\": 3 },\n      \"confidence\": 0.96,\n\
      \      \"entities\": [\n        {\n          \"name\": \"Invoice Number\",\n\
      \          \"value\": \"INV/2025/0154\",\n          \"confidence\": 0.97,\n\
      \          \"page\": 1,\n          \"bounding_box\": [0.12, 0.14, 0.30, 0.18]\n\
      \        },\n        {\n          \"name\": \"Invoice Amount\",\n          \"\
      value\": \"USD 45,000.00\",\n          \"confidence\": 0.94,\n          \"page\"\
      : 2,\n          \"bounding_box\": [0.15, 0.40, 0.35, 0.45]\n        }\n    \
      \  ]\n    },\n    {\n      \"document_type\": \"Bill of Lading\",\n      \"\
      pages\": { \"from\": 4, \"to\": 6 },\n      \"confidence\": 0.93,\n      \"\
      entities\": [\n        {\n          \"name\": \"BL Number\",\n          \"value\"\
      : \"BL-984572\",\n          \"confidence\": 0.95,\n          \"page\": 4,\n\
      \          \"bounding_box\": [0.10, 0.20, 0.25, 0.25]\n        },\n        {\n\
      \          \"name\": \"Port of Loading\",\n          \"value\": \"Shanghai,\
      \ China\",\n          \"confidence\": 0.90,\n          \"page\": 5,\n      \
      \    \"bounding_box\": [0.12, 0.32, 0.28, 0.36]\n        }\n      ]\n    }\n\
      \  ],\n  \"summary_notes\": {\n    \"missing_entities\": [\"HS Code\", \"Notify\
