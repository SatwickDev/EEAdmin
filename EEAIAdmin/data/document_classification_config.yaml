chunking:
  enabled: true
  entity_count_thresholds:
    small: 10
    medium: 20
    large: 30
  chunk_counts:
    small: 2
    medium: 3
    large: 4
    xlarge: 5
  base_seed: 12345
  seed_increment_per_chunk: 1
  min_entities_per_chunk: 1
  prioritize_mandatory_first: true
  priority_order:
  - Mandatory
  - Optional
  - Conditional
  # Chunk-specific extraction configuration
  prompt_template: |
    You are an advanced AI-powered data extraction engine specialized in international trade finance documents. You are processing a CHUNK of entities for efficient parallel extraction.

    ## CHUNK EXTRACTION RULES:

    ### 1. STRICT FIELD SCOPE:
    - Extract ONLY the fields explicitly listed in this chunk
    - Do NOT extract any other fields not in the chunk list
    - Focus on accuracy and precision for the specified fields only

    ### 2. DOCUMENT TYPE AWARENESS:
    - Use your knowledge of the document type to interpret field values correctly
    - Apply document-specific formatting and validation rules
    - Consider standard patterns for this document type

    ### 3. MANDATORY INCLUSION:
    - Include ALL fields in the response, even if not found
    - Use empty string "" with confidence 0 for missing fields
    - Never omit a field from the output

    ### 4. DATA FORMATTING:
    **DATES:**
    - Format: YYYY-MM-DD (ISO 8601)
    - Convert all date formats consistently

    **AMOUNTS:**
    - Include currency code (e.g., "USD 60,465.00")
    - Use comma thousand separators

    **BOUNDING BOXES:**
    - Use [0, 0, 0, 0] if no OCR coordinates available
    - Do NOT fabricate coordinates
    
    ### 5. EXACT TEXT EXTRACTION (CRITICAL - HIGHEST PRIORITY):

    **exact_text field:** Provides positioning context for bounding box generation. This field is CRITICAL for the entire system - incorrect extraction causes complete failure of bounding box highlighting.

    **CORE PRINCIPLE:** Extract text EXACTLY as it appears in OCR. Copy character-by-character including all spaces, punctuation, \n, and formatting quirks. Never clean or normalize.

    **EXTRACTION PRIORITY:**

    **Priority 1 - SWIFT Field Codes (ALWAYS PREFER):**
    If SWIFT field code exists (50:, 41A:, 32B:, 31D:, 59:, etc.), use it:
    - Field code must be within 1-3 lines DIRECTLY before the value
    - If other data exists between field code and value, do NOT use that field code
    - Include field code + all \n and intermediate text (only if no other data) + value line
    - STOP immediately after value line ends - never include next line even if duplicate or related

    **Priority 2 - Document Field Labels (SECOND CHOICE - 95% SEMANTIC MATCH REQUIRED):**
    If no SWIFT code, look for document field labels with 95-100% semantic confidence:

    HIGH CONFIDENCE MATCHES (USE THESE):
    - For "Consignee/Buyer/Importer" → Accept: "Consignee:", "Buyer:", "Ship To:", "Importer:", "Sold To:"
    - For "Invoice_Number" → Accept: "Invoice No:", "Invoice Number:", "Inv No:", "Invoice #:"
    - For "Currency" → Accept: "Currency:", "CCY:", "Curr:"
    - For "Number_of_Packages" → Accept: "No. of Packages:", "Packages:", "Pkg Qty:", "Total Packages:"
    - For "Port_of_Discharge" → Accept: "Port of Discharge:", "Discharge Port:", "POD:"

    LOW CONFIDENCE MATCHES (REJECT THESE):
    - Section headings like "Marks, numbers, number and kind of packages; description of goods" (NOT a field label for "Number_of_Packages")
    - Generic words like "Payment", "Details", "Total", "Note", "Description", "Information"
    - Vague partial matches like "Discharge" for "Port_of_Discharge" (too vague)

    CRITICAL RULES FOR FIELD LABELS:
    - Field label MUST be within 1-2 lines DIRECTLY before value
    - If 3+ lines of OTHER DATA exist between label and value, do NOT use that label
    - Field labels appear BEFORE the value, NEVER after
    - Ask: "If I see only this label, am I 95%+ sure it means THIS field?" If NO, reject it
    - Section headings are NOT field labels

    When valid field label found:
    - Include field label + value line ONLY
    - STOP immediately after value line
    - Do NOT include blocks of multiple lines

    **Priority 3 - No Field Label Found:**
    If NO SWIFT code AND NO high-confidence field label exists:
    - Single-word values (EUR, USD, 5%, dates, codes):
      - If on its own line OR directly next to a label → use label + value
      - If buried in sentence with no label → extract ONLY the value word, no surrounding context
    - Multi-word values (company names, addresses): Extract ONLY the value text exactly as it appears
    - DO NOT force a field label if none exists
    - DO NOT add surrounding words for context if value is in a sentence

    **ABSOLUTE STOPPING RULE (NON-NEGOTIABLE):**
    The exact_text MUST END exactly where the value line ends. Count carefully:
    - Line N: Field code/label (if exists) - INCLUDE
    - Line N+1 or N+2: Value line - INCLUDE and STOP HERE
    - Line N+2 onwards: ANY text after value - EXCLUDE COMPLETELY

    Do NOT continue to next line even if:
    - Next line is duplicate of value
    - Next line seems related (branch, location, additional info)
    - Next line has similar data

    STOP means STOP. No exceptions.

    **FORMATTING PRESERVATION (NON-NEGOTIABLE):**
    Preserve ALL formatting exactly as in OCR:
    - Spaces: single, double, multiple, tabs - keep all
    - Punctuation: commas, periods, semicolons, colons, dashes - keep all
    - Line breaks: \n - keep all exactly as they appear
    - Capitalization: keep exactly as found
    - Leading/trailing whitespace: keep all

    **SPECIAL CASES:**
    - Multi-line values: If entire address/description IS the value, include all value lines with \n, then STOP
    - Inferred/calculated values: If value doesn't exist in OCR (you calculated or guessed it), exact_text = ''
    - Duplicate lines: If value appears on consecutive lines, include ONLY the first occurrence, STOP

    **CRITICAL EXAMPLES:**

    CORRECT - SWIFT code, stops at value:
    OCR: "41A: Available With. By. FI BIC\nSPDBCNSH090\nSHANGHAI PUDONG DEVELOPMENT BANK\n(ZHENGZHOU BRANCH)"
    Field: "Bank_BIC"
    value: 'SPDBCNSH090'
    exact_text: '41A: Available With. By. FI BIC\nSPDBCNSH090'

    WRONG - Continuing past value:
    OCR: "PORT OF DISCHARGE\nPLACE OF DELIVERY\nABU DHABI SEAPORT,\nABU DHABI SEAPORT,"
    Field: "Port_of_Discharge"
    value: 'ABU DHABI SEAPORT'
    WRONG exact_text: 'PORT OF DISCHARGE\nPLACE OF DELIVERY\nABU DHABI SEAPORT,\nABU DHABI SEAPORT,'
    CORRECT exact_text: 'PORT OF DISCHARGE\nABU DHABI SEAPORT,'
    (Stops at first occurrence of value, does NOT include duplicate or "PLACE OF DELIVERY")

    WRONG - Using section heading as field label:
    OCR: "7. Marks, numbers, number and kind of packages; description of goods\nKANEMITE SC\nGREEN OASIS CO. LLC,\n3 PALLETS"
    Field: "Number_of_Packages"
    value: '3 PALLETS'
    WRONG exact_text: '7. Marks, numbers, number and kind of packages; description of goods\nKANEMITE SC\nGREEN OASIS CO. LLC,\n3 PALLETS'
    CORRECT exact_text: '3 PALLETS'
    (Section heading is NOT a field label, other data between heading and value, so just extract value)

    CORRECT - Single word with no field label:
    OCR: "The amount is EUR total"
    Field: "Currency"
    value: 'EUR'
    exact_text: 'EUR'
    (Buried in sentence, no field label, just extract value word only)

    CORRECT - Single word with field label:
    OCR: "Currency: EUR"
    Field: "Currency"
    value: 'EUR'
    exact_text: 'Currency: EUR'
    (Field label directly before value, include both)

    WRONG - Using invalid field label:
    OCR: "Payment\nGREEN OASIS CO. LLC."
    Field: "Consignee/Buyer"
    value: 'GREEN OASIS CO LLC'
    WRONG exact_text: 'Payment\nGREEN OASIS CO. LLC.'
    CORRECT exact_text: 'GREEN OASIS CO. LLC.'
    ("Payment" is NOT semantically related to Consignee/Buyer with 95% confidence, so just extract value)
    
    **SINGLE LINE EXTRACTION FOR VALUES IN PARAGRAPHS:**
    If value appears within a multi-line paragraph or statement:
    - Identify the SPECIFIC LINE where the value appears
    - Extract ONLY that line (plus field label line if directly before it)
    - DO NOT extract the entire paragraph

    **WARNING - SYSTEM FAILURE CONSEQUENCES:**
    Incorrect exact_text extraction causes:
    - Bounding box highlighting failures
    - Wrong text regions highlighted in document
    - Complete system malfunction
    - User cannot locate extracted data in document

    This field is the FOUNDATION of the entire bounding box system. Treat with maximum care and precision.

    **FINAL CHECKLIST BEFORE OUTPUTTING:**
    - Used SWIFT code if available and within 1-3 lines?
    - Used field label ONLY if 95%+ semantic match AND within 1-2 lines?
    - Rejected section headings and generic words as field labels?
    - Stopped IMMEDIATELY after value line?
    - Did NOT include duplicate lines or trailing text?
    - Preserved exact formatting (spaces, \n, punctuation)?
    - Set exact_text = '' for inferred/calculated values?

    ### 6. OUTPUT STRUCTURE:
    Return ONLY valid JSON (no markdown, no commentary):
    {{
      "page_number": <int>,
      "extracted_fields": {{
        "Field_Name": {{
          "value": "<extracted value or empty string>",
          "exact_text": "<exact value from OCR without changes>",
          "confidence": <0-100>,
          "bounding_box": [x1, y1, x2, y2],
          "bounding_page": <page>
        }}
      }},
      "confidence_score": <overall 0-100>
    }}

    ### Document Context:
    **Document Type:** {document_type}

    This is a **{document_type}** document. Use your knowledge of this document type to help identify and extract the fields accurately.

    ### Extraction Task - Chunk {chunk_id}
    You are processing chunk {chunk_id} containing {field_count} specific entities.

    ### Fields to Extract in This Chunk ({field_count} fields):

    {fields_text}

    ### OCR Text (Page {page_number}):
    {ocr_text}

    ### Required JSON Response:
    Return ONLY valid JSON (no markdown, no commentary):

    {{
      "page_number": {page_number},
      "extracted_fields": {{
        "<Field_Name>": {{
          "value": "<extracted value or empty string>",
          "exact_text": "<exact value from OCR without changes>",
          "confidence": <0-100>,
          "bounding_box": [<x1>, <y1>, <x2>, <y2>],
          "bounding_page": {page_number}
        }}
      }},
      "confidence_score": <overall 0-100>
    }}
required_documents:
  model: gpt-4o
  temperature: 0.1
  max_tokens: 2000
  seed: 12345
  top_p: 0.1
  frequency_penalty: 0
  presence_penalty: 0
  system_prompt: "You are a trade finance expert. Extract ALL documents from the text and return a JSON object with a 'documents' array. Each document must have 'name', 'description', 'priority', and 'category' fields."
  user_prompt_template: |
    You are a trade finance document expert. Parse the following required documents text and return a JSON object with a "documents" array.

    TEXT TO PARSE:
    {required_documents_text}

    INSTRUCTIONS:
    1. Extract EVERY distinct document mentioned in the text
    2. Each document should be a JSON object with these exact fields:
       - "name": Document type (e.g., "Commercial Invoice", "Bill of Lading")
       - "description": Brief requirements (10-15 words)
       - "priority": "Mandatory" or "Optional" 
       - "category": "trade", "financial", "certification", "shipping", or "other"

    RESPONSE FORMAT:
    Return a JSON object with this structure:
    {{
      "documents": [
        {{"name": "Commercial Invoice", "description": "Signed original, attested, legalized", "priority": "Mandatory", "category": "trade"}},
        {{"name": "Bill of Lading", "description": "Clean shipped on board, full set", "priority": "Mandatory", "category": "shipping"}}
      ]
    }}

    Extract ALL documents mentioned - typically 5-15 documents in an LC.

    CRITICAL INSTRUCTIONS:
    - Extract ALL documents mentioned in the text above
    - If you see numbers (1, 2, 3...) or bullets, each one is typically a separate document
    - Look for document names like "invoice", "bill of lading", "certificate", "policy", "list"
    - Standardize abbreviations: B/L → Bill of Lading, C/O → Certificate of Origin, GSP → Certificate of Origin (GSP Form)
    - If one item mentions multiple documents (e.g., "invoice and packing list"), create separate entries
    - Return ONLY the JSON array with NO extra text

    Output format:
    [
      {{"name": "Commercial Invoice", "description": "Signed original, attested, legalized by embassy", "priority": "Mandatory", "category": "trade"}},
      {{"name": "Bill of Lading", "description": "Full set, clean on board, made to order", "priority": "Mandatory", "category": "shipping"}},
      {{"name": "Certificate of Origin", "description": "Attested by chamber, legalized", "priority": "Mandatory", "category": "certification"}},
      {{"name": "Marine Insurance Policy", "description": "110% invoice value, warehouse to warehouse", "priority": "Mandatory", "category": "financial"}},
      {{"name": "Packing List", "description": "Original plus copies", "priority": "Mandatory", "category": "trade"}}
    ]
  response_format: json_object
  fallback_json_extraction: true
  default_priority: Mandatory
  default_category: other
  categories:
  - trade
  - financial
  - certification
  - shipping
  - other
lc_conditions_parse:
  model: gpt-4o
  temperature: 0.1
  max_tokens: 15000
  seed: 12345
  top_p: 0.1
  frequency_penalty: 0
  presence_penalty: 0
  system_prompt: "You are an expert LC conditions parser. Your task is to extract ALL INDIVIDUAL validation rules from LC Additional Conditions text. You MUST return a JSON ARRAY containing 15-30+ separate rule objects. Each requirement becomes its own rule object. NEVER return a single object - ALWAYS return an array [...]."
  user_prompt_template: |
    CRITICAL INSTRUCTION: You MUST return a JSON ARRAY starting with [ and ending with ]. DO NOT return a single object {{...}}. ALWAYS return an array of multiple objects [{{...}}, {{...}}, {{...}}].

    TASK: Parse the LC Additional Conditions text below into MULTIPLE separate validation rules. Each numbered condition should produce 2-5+ individual rules.

    EXAMPLE - How to extract rules:
    Input: "1. ALL DOCUMENTS MUST BE DATED, PREPARED IN ENGLISH ONLY AND MUST BEAR OUR L/C NUMBER DULY SIGNED BY ISSUER."
    
    Output - ONE sentence becomes FOUR separate rules in an ARRAY:
    [
      {{
        "id": "lc-cond-001",
        "code": "LC-COND-001", 
        "category": "date_validation",
        "description": "All documents must be dated",
        "field_affected": "all_documents",
        "validation_type": "date_required",
        "expected_value": "valid_date",
        "severity": "high",
        "actionable": true
      }},
      {{
        "id": "lc-cond-002",
        "code": "LC-COND-002",
        "category": "language", 
        "description": "All documents must be prepared in English only",
        "field_affected": "all_documents",
        "validation_type": "language_check", 
        "expected_value": "English",
        "severity": "high",
        "actionable": true
      }},
      {{
        "id": "lc-cond-003", 
        "code": "LC-COND-003",
        "category": "reference_number",
        "description": "All documents must bear LC number {{lc_number}}",
        "field_affected": "all_documents", 
        "validation_type": "contains_lc_number",
        "expected_value": "{{lc_number}}",
        "severity": "high",
        "actionable": true
      }},
      {{
        "id": "lc-cond-004",
        "code": "LC-COND-004", 
        "category": "signature",
        "description": "All documents must be duly signed by issuer",
        "field_affected": "all_documents",
        "validation_type": "signature_required", 
        "expected_value": "signed",
        "severity": "high", 
        "actionable": true
      }}
    ]

    NOW PARSE THESE ACTUAL LC CONDITIONS:

    LC Number: {lc_number}
    
    Additional Conditions Text:
    {additional_conditions_text}

    INSTRUCTIONS:
    1. Read through ALL 14+ numbered conditions in the text above
    2. Break down EACH condition into separate atomic requirements
    3. Create a rule object for EACH atomic requirement
    4. Return as JSON ARRAY with 15-30+ rule objects
    5. Start your response with [ and end with ]
    6. DO NOT return just one rule - return ALL rules from ALL conditions

    Your response must be a valid JSON array starting with [
  response_format: text
  expected_rules_min: 15
  expected_rules_max: 30
lc_conditions_validate:
  model: gpt-4o
  temperature: 0.1
  max_tokens: 8000
  system_prompt: "You are a precise LC validator. Return ONLY valid JSON array. No explanations. Check all rules against all documents."
  user_prompt_template: |
    Validate documents against LC conditions. Return ONLY valid JSON array.

    LC DATA:
    - LC Number: {lc_number}
    - Beneficiary: {beneficiary}
    - Issue Date: {issue_date}
    - Expiry Date: {expiry_date}

    DOCUMENTS ({doc_count} total):
    {doc_summaries}

    RULES TO VALIDATE ({rules_count} rules):
    {batch_rules}

    CRITICAL: Validate EACH rule against ALL {doc_count} documents.

    OUTPUT FORMAT (JSON array only, no markdown):
    [
      {{
        "rule": {{"code": "LC-COND-XXX", "description": "rule text"}},
        "status": "compliant" OR "non_compliant" OR "manual_review",
        "isCompliant": true OR false OR null,
        "message": "summary for all {doc_count} documents",
        "severity": "high",
        "category": "category_name",
        "details": {{
          "compliant": [{{
            "document": "Type", 
            "fileName": "name", 
            "pages": "Pages X", 
            "reason": "why compliant",
            "fieldValue": "actual value found that made it compliant",
            "fieldName": "name of field checked"
          }}],
          "nonCompliant": [{{
            "document": "Type", 
            "fileName": "name", 
            "pages": "Pages X", 
            "reason": "why non-compliant",
            "fieldValue": "actual problematic value found",
            "expectedValue": "what was expected",
            "fieldName": "name of field checked"
          }}],
          "requiresManualReview": [{{
            "document": "Type", 
            "fileName": "name", 
            "pages": "Pages X", 
            "reason": "why manual review needed",
            "fieldValue": "actual value found (if any)",
            "fieldName": "name of field checked"
          }}]
        }}
      }}
    ]

    CRITICAL: Always include actual field values that were checked. For example:
    - fieldValue: "Deutsche Bank AG" (for language check - non-compliant because German)
    - fieldValue: "ILCAE00221000098" (for LC number check - compliant)  
    - fieldValue: "15-Nov-2024" (for date check - compliant/non-compliant based on requirements)
    - fieldValue: "" or "Not found" (for missing required fields)

    Return results for all {rules_count} rules. Check every document and show actual values.
  batch_size: 4
  parallel_processing: true
discrepancy_rules:
  classify_rules:
    model: gpt-4o
    temperature: 0.1
    max_tokens: 2000
    system_prompt: "You are a trade finance compliance expert. Classify rules accurately based on their purpose."
    user_prompt_template: |
      Analyze the following compliance rules and classify each into ONE of these categories:

      1. **lc_comparison**: Rules that require comparing a document field value against Letter of Credit (LC) requirements
         Examples: "must match LC", "consistent with LC", "as per LC terms"

      2. **cross_document**: Rules that require comparing values across different documents
         Examples: "must match invoice", "consistent with packing list", "match across documents"

      NOTE: Only classify into lc_comparison or cross_document. Do NOT include validation rules.

      Rules to classify:
      {rules_text}

      Return ONLY a JSON object (no markdown, no explanation):
      {{
        "lc_comparison": [list of rule codes],
        "cross_document": [list of rule codes]
      }}
  lc_comparison:
    model: gpt-4o
    temperature: 0.1
    max_tokens: 2000
    system_prompt: "You are a trade finance compliance expert comparing document fields against LC values."
    user_prompt_template: |
      You are a trade finance compliance expert. Analyze the document fields against LC values based on the provided rules.

      **Document Type:** {doc_type}
      **Document Name:** {doc_name}

      **Document Fields (Extracted Entities):**
      {entities}

      **LC Context (All Available LC Fields):**
      {lc_context}

      **Applicable Rules ({rules_count} rules):**
      {rules_summary}

      **Task:**
      1. Identify which document fields should be compared against LC values based on the rules
      2. For each relevant comparison, determine if the document value is semantically equivalent to the LC value
      3. Accept semantic equivalence (abbreviations, format variations, synonyms)
      4. Only flag as non-compliant if there's a genuine discrepancy

      **CRITICAL RULES:**
      - NEVER make assumptions about missing or empty values
      - If either documentValue or lcValue is empty, null, "N/A", "Not found", or missing, you MUST still include it in the comparison with "compliant": false
      - DO NOT substitute assumed values for missing data
      - Return actual extracted values only - if no value exists, use empty string "" or the exact text found

      **Return ONLY a JSON array:**
      [
        {{
          "field": "Document field name",
          "documentValue": "Value from document (use empty string if not found - DO NOT ASSUME)",
          "lcField": "Matching LC field name",
          "lcValue": "Value from LC (use empty string if not found - DO NOT ASSUME)",
          "ruleCode": "R-XXXX",
          "ruleDescription": "Rule description",
          "compliant": false if either value is missing/empty, otherwise true/false based on comparison,
          "explanation": "Brief explanation of comparison result",
          "severity": "high" if values are missing/empty, otherwise "low" or "high"
        }}
      ]

      Return actual values only - DO NOT create placeholder values. If a field is truly missing, use empty string "".
  cross_document:
    model: gpt-4o
    temperature: 0.1
    max_tokens: 4000
    system_prompt: "You are a trade finance expert checking cross-document consistency. Be thorough."
    user_prompt_template: |
      You are a trade finance compliance expert. Analyze field consistency across multiple documents based on cross-document rules.

      **Documents ({doc_count} total):**
      {doc_data}

      **Cross-Document Rules ({rules_count} rules):**
      {rules_summary}

      **Task:**
      1. Identify which fields should be consistent across documents based on the rules
      2. Compare values across documents for semantic consistency
      3. Accept semantic equivalence (abbreviations, format variations, synonyms)
      4. Flag genuine inconsistencies where values have different meanings

      **Return ONLY a JSON array:**
      [
        {{
          "field": "Field name",
          "document1Name": "First document name",
          "document1Value": "Value in first document",
          "document2Name": "Second document name",  
          "document2Value": "Value in second document",
          "ruleCode": "R-XXXX",
          "ruleDescription": "Rule description",
          "compliant": true or false,
          "explanation": "Brief explanation",
          "severity": "low" or "medium"
        }}
      ]

      **IMPORTANT:** Only include fields that SHOULD be compared per the rules. Return empty array [] if no cross-document comparisons are needed.
