                "name": "Invoice Number",
                "value": "INV/2025/0154",
                "confidence": 0.97,
                "page": 1,
                "bounding_box": [0.12, 0.14, 0.30, 0.18]
              },
              {
                "name": "Invoice Amount",
                "value": "USD 45,000.00",
                "confidence": 0.94,
                "page": 2,
                "bounding_box": [0.15, 0.40, 0.35, 0.45]
              }
            ]
          },
          {
            "document_type": "Bill of Lading",
            "pages": { "from": 4, "to": 6 },
            "confidence": 0.93,
            "entities": [
              {
                "name": "BL Number",
                "value": "BL-984572",
                "confidence": 0.95,
                "page": 4,
                "bounding_box": [0.10, 0.20, 0.25, 0.25]
              },
